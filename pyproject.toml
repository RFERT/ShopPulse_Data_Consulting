[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shoppulse"
version = "0.1.0"
description = "Plateforme Data & IA pour ShopPulse (dataset Olist) — Mission Flash"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "RFERT" }]
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "joblib>=1.3",
    "torch>=2.2",
    "streamlit>=1.33",
    "plotly>=5.20",
    "scipy>=1.12",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "httpx>=0.27",
]
notebooks = [
    "jupyter>=1.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W", "N"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["shoppulse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=shoppulse --cov=shoppulse_etl --cov-report=term-missing"
pythonpath = ["src", "pipelines"]

[tool.coverage.run]
source = ["shoppulse"]
omit = ["*/__init__.py"]
