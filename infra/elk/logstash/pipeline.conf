# Pipeline Logstash (bonus ELK) — lit les logs JSON de l'API et les pousse vers Elasticsearch.
input {
  file {
    path => "/var/log/shoppulse/api.jsonl"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => json
  }
}

filter {
  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "shoppulse-api-%{+YYYY.MM.dd}"
  }
}
